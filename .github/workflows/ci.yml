name: ci

on:
  workflow_dispatch:
    inputs:
      only:
        description: Platform selection for manual runs
        type: choice
        required: false
        default: all
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]

# Build jobs execute npm install scripts and compile third-party source. They
# only need read access; the tag-only release job owns the write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # The measured cold builds took 21m on arm64 and 34m on x64; let them
  # finish so their prefix cache is saved when another main commit arrives.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Every push to main is a release: MAJOR.MINOR comes from the repo, the patch is the workflow run number.
      # A pushed v* tag releases that exact version. Pull requests and manual runs never release.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "v=$(scripts/stamp-version.sh --base).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v=" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  linux-x64:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'linux-x64' || inputs.only == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: toolchain and compiler key
        id: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          echo "gcc=$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          g++ --version | head -1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: install published lmscript compiler (DSL v5)
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.401
          scripts/select-compiler.sh | tee compiler.txt
          grep -qx "$(command -v lmscript)" compiler.txt || { echo "published v5 lmscript was not selected"; exit 1; }
      - name: restore static OCCT install prefix
        id: occt-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-linux-x64-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: build and install OCCT 8.0.1 static (cold cache only)
        id: build-occt
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          OCCT_SRC: ${{ runner.temp }}/occt-src
          OCCT_BUILD: ${{ runner.temp }}/occt-build
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: scripts/build-occt.sh
      - name: save completed OCCT prefix even if later checks fail
        if: always() && steps.occt-cache.outputs.cache-hit != 'true' && steps.build-occt.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-linux-x64-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: sync and verify vendored SDK
        run: scripts/sync-sdk.sh --verify
      - name: build and run tests
        env:
          # lets lmscript install lmplot for the lmcad + lmplot examples
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LMCAD_OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
          LMCAD_FULL_STATIC: ON
        run: ./test.sh
      - name: assert fully static executable
        run: |
          file build/lmcad | tee binary-file.txt
          ldd build/lmcad > binary-ldd.txt 2>&1 || true
          cat binary-ldd.txt
          grep -q 'not a dynamic executable' binary-ldd.txt
      - name: stage release binary
        env:
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: |
          mkdir -p dist
          cp build/lmcad dist/lmcad-linux-x64
          scripts/stage-release-notices.sh dist "$OCCT_PREFIX"
          stat -c '%n %s bytes' dist/lmcad-linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmcad-linux-x64
          path: dist/
          if-no-files-found: error

  linux-arm64:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'linux-arm64' || inputs.only == 'all'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: toolchain and compiler key
        id: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          echo "gcc=$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          g++ --version | head -1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: install published lmscript compiler (DSL v5)
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.401
          scripts/select-compiler.sh | tee compiler.txt
          grep -qx "$(command -v lmscript)" compiler.txt || { echo "published v5 lmscript was not selected"; exit 1; }
      - name: restore static OCCT install prefix
        id: occt-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-linux-arm64-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: build and install OCCT 8.0.1 static (cold cache only)
        id: build-occt
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          OCCT_SRC: ${{ runner.temp }}/occt-src
          OCCT_BUILD: ${{ runner.temp }}/occt-build
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: scripts/build-occt.sh
      - name: save completed OCCT prefix even if later checks fail
        if: always() && steps.occt-cache.outputs.cache-hit != 'true' && steps.build-occt.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-linux-arm64-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: sync and verify vendored SDK
        run: scripts/sync-sdk.sh --verify
      - name: build and run tests
        env:
          # lets lmscript install lmplot for the lmcad + lmplot examples
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LMCAD_OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
          LMCAD_FULL_STATIC: ON
        run: ./test.sh
      - name: assert fully static executable
        run: |
          file build/lmcad | tee binary-file.txt
          ldd build/lmcad > binary-ldd.txt 2>&1 || true
          cat binary-ldd.txt
          grep -q 'not a dynamic executable' binary-ldd.txt
      - name: stage release binary
        env:
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: |
          mkdir -p dist
          cp build/lmcad dist/lmcad-linux-arm64
          scripts/stage-release-notices.sh dist "$OCCT_PREFIX"
          stat -c '%n %s bytes' dist/lmcad-linux-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmcad-linux-arm64
          path: dist/
          if-no-files-found: error

  # macOS: OCCT static archives with AppleClang; no `-static` exists on
  # macOS, so the audit is otool -L (only system libs may remain).
  macos-arm64:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'macos-arm64' || inputs.only == 'all'
    runs-on: macos-15
    env:
      LMCAD_PLATFORM: macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: toolchain and compiler key
        id: toolchain
        run: |
          brew install ninja
          echo "clang=$(clang++ -dumpversion)" >> "$GITHUB_OUTPUT"
          clang++ --version | head -1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: install published lmscript compiler (DSL v5)
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.401
          scripts/select-compiler.sh | tee compiler.txt
          grep -qx "$(command -v lmscript)" compiler.txt || { echo "published v5 lmscript was not selected"; exit 1; }
      - name: restore static OCCT install prefix
        id: occt-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-${{ env.LMCAD_PLATFORM }}-clang-${{ steps.toolchain.outputs.clang }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: build and install OCCT 8.0.1 static (cold cache only)
        id: build-occt
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          OCCT_SRC: ${{ runner.temp }}/occt-src
          OCCT_BUILD: ${{ runner.temp }}/occt-build
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: scripts/build-occt.sh
      - name: save completed OCCT prefix even if later checks fail
        if: always() && steps.occt-cache.outputs.cache-hit != 'true' && steps.build-occt.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-${{ env.LMCAD_PLATFORM }}-clang-${{ steps.toolchain.outputs.clang }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: sync and verify vendored SDK
        run: scripts/sync-sdk.sh --verify
      - name: build and run tests
        env:
          # lets lmscript install lmplot for the lmcad + lmplot examples
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LMCAD_OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
          LMCAD_FULL_STATIC: OFF
        run: ./test.sh
      - name: assert only system libraries remain
        run: |
          otool -L build/lmcad | tee binary-otool.txt
          tail -n +2 binary-otool.txt | awk '{print $1}' | grep -v '^/usr/lib/\|^/System/Library/' > non-system-libs.txt || true
          [ ! -s non-system-libs.txt ] || { cat non-system-libs.txt; exit 1; }
      - name: stage release binary
        env:
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: |
          mkdir -p dist
          cp build/lmcad "dist/lmcad-$LMCAD_PLATFORM"
          scripts/stage-release-notices.sh dist "$OCCT_PREFIX" darwin
          wc -c < "dist/lmcad-$LMCAD_PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmcad-${{ env.LMCAD_PLATFORM }}
          path: dist/
          if-no-files-found: error

  macos-x64:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'macos-x64' || inputs.only == 'all'
    runs-on: macos-15-intel
    env:
      LMCAD_PLATFORM: macos-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: toolchain and compiler key
        id: toolchain
        run: |
          brew install ninja
          echo "clang=$(clang++ -dumpversion)" >> "$GITHUB_OUTPUT"
          clang++ --version | head -1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: install published lmscript compiler (DSL v5)
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.401
          scripts/select-compiler.sh | tee compiler.txt
          grep -qx "$(command -v lmscript)" compiler.txt || { echo "published v5 lmscript was not selected"; exit 1; }
      - name: restore static OCCT install prefix
        id: occt-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-${{ env.LMCAD_PLATFORM }}-clang-${{ steps.toolchain.outputs.clang }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: build and install OCCT 8.0.1 static (cold cache only)
        id: build-occt
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          OCCT_SRC: ${{ runner.temp }}/occt-src
          OCCT_BUILD: ${{ runner.temp }}/occt-build
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: scripts/build-occt.sh
      - name: save completed OCCT prefix even if later checks fail
        if: always() && steps.occt-cache.outputs.cache-hit != 'true' && steps.build-occt.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-${{ env.LMCAD_PLATFORM }}-clang-${{ steps.toolchain.outputs.clang }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: sync and verify vendored SDK
        run: scripts/sync-sdk.sh --verify
      - name: build and run tests
        env:
          # lets lmscript install lmplot for the lmcad + lmplot examples
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LMCAD_OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
          LMCAD_FULL_STATIC: OFF
        run: ./test.sh
      - name: assert only system libraries remain
        run: |
          otool -L build/lmcad | tee binary-otool.txt
          tail -n +2 binary-otool.txt | awk '{print $1}' | grep -v '^/usr/lib/\|^/System/Library/' > non-system-libs.txt || true
          [ ! -s non-system-libs.txt ] || { cat non-system-libs.txt; exit 1; }
      - name: stage release binary
        env:
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: |
          mkdir -p dist
          cp build/lmcad "dist/lmcad-$LMCAD_PLATFORM"
          scripts/stage-release-notices.sh dist "$OCCT_PREFIX" darwin
          wc -c < "dist/lmcad-$LMCAD_PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmcad-${{ env.LMCAD_PLATFORM }}
          path: dist/
          if-no-files-found: error

  # Windows: MinGW-w64 + GNU ld (--start-group works); -static yields a
  # standalone .exe. POSIX-only checks are skipped in test.sh (documented).
  windows-x64:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'windows-x64' || inputs.only == 'all'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: stamp release version
        if: needs.version.outputs.v != ''
        run: scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: toolchain and compiler key
        id: toolchain
        run: |
          if ! command -v g++ >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            for i in 1 2 3; do
              choco install -y mingw ninja && break
              echo "choco attempt $i failed; retrying"; sleep 20
            done
          fi
          command -v g++ >/dev/null 2>&1 || { echo "no mingw g++ on PATH"; exit 1; }
          echo "gcc=$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          g++ --version | head -1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: install published lmscript compiler (DSL v5)
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.401
          scripts/select-compiler.sh | tee compiler.txt
          grep -qx "$(command -v lmscript)" compiler.txt || { echo "published v5 lmscript was not selected"; exit 1; }
      - name: python3 shim (git-bash has none)
        run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
          chmod +x .ci-bin/python3
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
      - name: restore static OCCT install prefix
        id: occt-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-windows-x64-mingw-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: build and install OCCT 8.0.1 static (cold cache only)
        id: build-occt
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          OCCT_SRC: ${{ runner.temp }}/occt-src
          OCCT_BUILD: ${{ runner.temp }}/occt-build
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: scripts/build-occt.sh
      - name: save completed OCCT prefix even if later checks fail
        if: always() && steps.occt-cache.outputs.cache-hit != 'true' && steps.build-occt.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/occt-prefix
          key: occt-8.0.1-windows-x64-mingw-gcc-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('.github/occt-cmake-flags.txt') }}
      - name: sync and verify vendored SDK
        run: scripts/sync-sdk.sh --verify
      - name: build and run tests
        env:
          # lets lmscript install lmplot for the lmcad + lmplot examples
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LMCAD_OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
          LMCAD_FULL_STATIC: ON
        run: ./test.sh
      - name: assert standalone executable
        run: |
          objdump -p build/lmcad.exe | grep 'DLL Name' | tee binary-dlls.txt
          grep -iE 'libstdc|libgcc|winpthread' binary-dlls.txt && exit 1
          true
      - name: stage release binary
        env:
          OCCT_PREFIX: ${{ runner.temp }}/occt-prefix
        run: |
          mkdir -p dist
          cp build/lmcad.exe dist/lmcad-windows-x64.exe
          scripts/stage-release-notices.sh dist "$OCCT_PREFIX" mingw
          wc -c < dist/lmcad-windows-x64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmcad-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-24.04
    env:
      REL_VERSION: ${{ needs.version.outputs.v }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmcad-*
          path: dist
          merge-multiple: true
      - name: tag matches lmcad --version (lmscript @latest compares them)
        run: |
          chmod +x dist/lmcad-linux-x64
          got="$(dist/lmcad-linux-x64 --version)"
          test "$got" = "lmcad $REL_VERSION" || { echo "::error::tag v$REL_VERSION but binary says '$got' (bump project VERSION in CMakeLists.txt)"; exit 1; }
      - name: attach third-party notices and private npm layout
        run: |
          cp LICENSE dist/LICENSE
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES
          mkdir -p relinking/.github relinking/scripts relinking/licenses relinking/cpp relinking/schema relinking/tools relinking/objects relinking/durable-memory
          cp LICENSE relinking/LICENSE
          cp THIRD_PARTY_NOTICES.md relinking/THIRD_PARTY_NOTICES
          cp .github/occt-cmake-flags.txt relinking/.github/
          cp scripts/build-occt.sh relinking/scripts/
          cp CMakeLists.txt relinking/
          cp cpp/*.cpp cpp/*.hpp relinking/cpp/
          cp schema/lmcad.dsl.json relinking/schema/
          cp tools/apng-extract.cpp relinking/tools/
          cp licenses/* relinking/licenses/
          cp dist/lmcad-linux-*-relink-objects.tar.gz relinking/objects/
          cp dist/OCCT-LICENSE_LGPL_21.txt dist/OCCT-LGPL-EXCEPTION.txt dist/LGPL-2.1.txt dist/GPL-3.txt dist/GCC-RUNTIME-LIBRARY-EXCEPTION-3.1.txt dist/GCC-TOOLCHAIN-COPYRIGHT dist/GLIBC-COPYRIGHT relinking/licenses/
          cp durable-memory/13-licensing.md relinking/durable-memory/
          tar -czf dist/lmcad-occt-relinking-recipe.tar.gz -C relinking .
          scripts/npm-layout.sh dist npm-packages "$REL_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: npm-packages/
          if-no-files-found: error
      - name: generate checksums for platform binaries
        run: |
          cd dist
          sha256sum lmcad-linux-x64 lmcad-linux-arm64 lmcad-macos-arm64 lmcad-macos-x64 lmcad-windows-x64.exe > SHA256SUMS
      - name: attach binaries and notices to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: re-running a tag's workflow refreshes the assets instead
        # of failing because the release already exists.
        run: |
          if gh release view "v$REL_VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "v$REL_VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "v$REL_VERSION" --generate-notes dist/*
          fi
